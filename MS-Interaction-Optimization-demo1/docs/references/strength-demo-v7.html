<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>力量训练 · 全屏交互演示</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#000;color:#f3f4ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}.screen{position:relative;width:min(100vw,calc(100dvh * 9 / 16));aspect-ratio:9/16;container-type:inline-size;background:#000;overflow:hidden;--accent:#b8f56a;--rgb:184,245,106}.training{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0009 0%,#0003 17%,transparent 35%,transparent 80%,#0007 100%)}.wash{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(var(--rgb),.26),transparent 16%,transparent 83%,rgba(var(--rgb),.28));box-shadow:inset 0 0 40px rgba(var(--rgb),.17)}.wash.pulse{animation:pulse 1.8s ease-out}@keyframes pulse{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.top{position:absolute;left:5cqw;right:5cqw;top:4.8cqw}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw}.metric{border-left:1px solid #ffffff26;padding-left:2cqw}.metric:first-child{border:0;padding-left:0}.metric label{display:block;font-size:2.5cqw;color:#b4c5bc;margin-bottom:1.4cqw}.metric strong{font-family:Arial,sans-serif;font-style:italic;font-size:5.5cqw;letter-spacing:-.2cqw;font-variant-numeric:tabular-nums}.metric small{font-size:1.9cqw;color:#c0c7bd;margin-left:.5cqw}.progress{height:.6cqw;background:#ffffff1c;margin-top:3.6cqw;border-radius:1cqw;overflow:hidden}.progress i{display:block;height:100%;width:33%;background:linear-gradient(90deg,#41755e,#bcf877);box-shadow:0 0 12px #b8f56a}.course{font-size:2.7cqw;margin-top:2.4cqw;color:#c8d8d3;letter-spacing:.3cqw}
.feedback{position:absolute;top:14%;right:4cqw;display:flex;align-items:center;gap:3cqw;height:30cqw}.score{width:23cqw;align-self:flex-start;padding-top:1cqw;text-align:right}.number{height:16cqw;display:flex;align-items:center;justify-content:flex-end}.number b{font:bold italic 13cqw Arial;letter-spacing:-.7cqw;color:#fff;text-shadow:0 0 28px rgba(var(--rgb),.24)}.gauge{display:flex;align-items:flex-end;gap:.5cqw;height:10cqw;transform:skewY(-8deg);width:100%;padding-bottom:1cqw;border-bottom:1px solid #ffffff18}.gauge i{display:block;flex:1;height:var(--h);background:#ffffff20;transition:background .2s,box-shadow .2s}.gauge i.lit{background:var(--accent);box-shadow:0 0 7px rgba(var(--rgb),.38)}.gauge.unknown{opacity:.2}.bodycard{width:21cqw;height:30cqw;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff18;background:linear-gradient(180deg,#11201c70,#17201f9c);border-radius:2cqw}.bodycard svg{width:14cqw;height:26cqw;filter:drop-shadow(0 0 5px #ffffff18)}.bone{stroke:#f1f4ff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}.joint{fill:#f1f4ff}.unrecognized{display:none;margin:0;padding:1.5cqw;font-size:3.6cqw;line-height:1.55;color:#e8eee9;text-align:center;font-weight:550}.bodycard.is-unknown svg{display:none}.bodycard.is-unknown .unrecognized{display:block}
.results-area{position:absolute;left:4cqw;right:4cqw;bottom:4.5cqw;height:23cqw;overflow:hidden}.result-list{position:absolute;inset:0;overflow:hidden;isolation:isolate}.result-row{position:absolute;bottom:0;left:0;right:0;height:10cqw;padding:0 3cqw;display:flex;align-items:center;border-left:2px solid var(--result-color);border-radius:0 1.8cqw 1.8cqw 0;background:#101a17cf;transform:translateY(calc(var(--index)*-12cqw));transition:transform .36s cubic-bezier(.22,.8,.3,1);opacity:1;backdrop-filter:blur(6px)}.result-row strong{display:block;min-width:0;width:100%;white-space:nowrap;font-size:4cqw;line-height:1.25;font-weight:550;color:#f1f4f0}.result-bubble{position:absolute;left:0;right:0;top:1cqw;height:20cqw;z-index:5;display:none;align-items:center;transform-origin:70% 82%;padding:3cqw;border:1px solid var(--result-color);border-left:3px solid var(--result-color);border-radius:3cqw;background:linear-gradient(120deg,#1c2b27ec,#101819ed 70%);box-shadow:0 5px 24px #000b;will-change:transform;backdrop-filter:blur(8px)}.bubble-copy{width:100%;min-width:0;visibility:visible}.result-bubble h2{margin:0;font-size:4.5cqw;line-height:1.3;white-space:nowrap;font-weight:650}.screen.reduced .wash{display:none}.screen.reduced *{transition:none!important;animation:none!important}
/* A shared translucent panel keeps both halves readable over any video. */
.feedback{
 left:4cqw;right:4cqw;top:14.5%;height:29cqw;
 display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:0;
 border:1px solid #ffffff22;border-radius:3cqw;
 background:linear-gradient(120deg,rgba(20,29,28,.72),rgba(9,17,18,.62));
 backdrop-filter:blur(12px) saturate(.85);-webkit-backdrop-filter:blur(12px) saturate(.85);
 box-shadow:0 8px 32px #0003,inset 0 1px 0 #ffffff0c;
}
.feedback:before{content:'';position:absolute;left:50%;top:4cqw;bottom:4cqw;width:1px;background:linear-gradient(transparent,#ffffff29,transparent)}
.feedback:after{content:'';position:absolute;left:8cqw;right:8cqw;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.35),transparent)}
.bodycard{width:100%;height:100%;border:0;background:none;border-radius:0}
.bodycard svg{width:14cqw;height:24.5cqw;filter:drop-shadow(0 0 5px #ffffff0c)}
.unrecognized{max-width:34cqw;padding:2cqw;font-size:3.8cqw;line-height:1.55}
.score{width:100%;height:100%;align-self:center;padding:2cqw 5.5cqw 3.5cqw;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1.8cqw}
.number{height:17cqw;justify-content:center}
.number b{font-size:13.5cqw;letter-spacing:-.5cqw;line-height:1;text-shadow:0 0 24px rgba(var(--rgb),.18)}
.gauge{position:relative;display:flex;align-items:stretch;gap:.55cqw;height:2.7cqw;min-height:2.7cqw;transform:none;padding:0;border:0;width:100%;--fill:95%}
.gauge i{height:100%;background:#ffffff12;border-radius:.35cqw;transition:background .16s,box-shadow .16s}
.gauge i.lit{background:var(--accent);box-shadow:0 0 6px rgba(var(--rgb),.24)}
.gauge:after{content:'';position:absolute;inset:0 auto 0 0;width:var(--fill);border-radius:.35cqw;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 38%,#ffffffb3 49%,transparent 60%);background-size:250% 100%}
.gauge.sweep:after{animation:score-sweep 850ms 220ms ease-out}
@keyframes score-sweep{0%{opacity:0;background-position:180% 0}20%{opacity:.85}85%{opacity:.55}100%{opacity:0;background-position:-80% 0}}
.gauge.unknown{opacity:.18}
.gauge.unknown:after{display:none}
/* V6: one unobtrusive top scrim, fading into the video. */
.shade{background:linear-gradient(to bottom,rgba(0,0,0,.52) 0%,rgba(0,0,0,.34) 11%,rgba(0,0,0,.18) 23%,rgba(0,0,0,.07) 30%,rgba(0,0,0,0) 36%);}
.feedback{border:0;border-radius:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;}
.feedback:before,.feedback:after{display:none;}/* V7: charcoal instead of pure black, readable over both black and bright video. */
.training{z-index:0;}
.shade{z-index:1;background:linear-gradient(to bottom,rgba(42,49,54,.66) 0%,rgba(39,46,51,.60) 12%,rgba(35,42,47,.48) 25%,rgba(31,38,43,.30) 32%,rgba(27,34,39,.12) 38%,rgba(27,34,39,0) 44%);}
.wash{z-index:2;}
.top,.feedback,.results-area{z-index:3;}</style></head><body><main class="screen" id="screen" aria-label="力量训练自动演示">
